# Configuracao do banco (antes ficava no persistence.xml).
# Padrao: H2 em arquivo na pasta data/ do projeto, sem instalar nada.
# Para usar MySQL, troque as tres linhas de conexao, por exemplo:
#   spring.datasource.url=jdbc:mysql://localhost:3306/pgcd?createDatabaseIfNotExist=true&serverTimezone=UTC
#   spring.datasource.username=root
#   spring.datasource.password=
pgcd.persistence.unit=pgcdPU
spring.datasource.url=jdbc:h2:file:./data/pgcd
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.main.banner-mode=off
